<!DOCTYPE html><html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MMS App</title>
<link rel="manifest" href="manifest.json">
<style>
body{font-family:Arial;margin:0;background:#eef2f7}
header{background:#1e73be;color:white;text-align:center;padding:15px}
.section{display:none;padding:20px;animation:fade 0.4s}
.active{display:block}
@keyframes fade{from{opacity:0}to{opacity:1}}
.card{background:white;margin:10px;padding:20px;border-radius:15px;text-align:center;box-shadow:0 3px 8px rgba(0,0,0,0.1)}
input,select{width:100%;padding:10px;margin:10px 0;border-radius:10px;border:1px solid #ccc}
button{background:#1e73be;color:white;border:none;padding:10px;border-radius:10px;width:100%}
nav{position:fixed;bottom:0;width:100%;background:white;display:flex;justify-content:space-around;padding:10px 0;box-shadow:0 -2px 6px rgba(0,0,0,0.1)}
nav button{background:none;border:none;font-size:16px;color:#1e73be}
#splash{position:fixed;top:0;left:0;width:100%;height:100%;background:#1e73be;color:white;display:flex;justify-content:center;align-items:center;font-size:30px;z-index:1000}
</style>
</head>
<body><div id="splash">MMS 🚀</div><header>MMS App</header><div id="home" class="section active">
<h2>Welcome 👋</h2>
<p>All services in one app</p>
<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:15px;margin-top:20px">
<div class="card" onclick="show('services')">🛠 Services</div>
<div class="card" onclick="show('booking')">📦 Book</div>
<div class="card" onclick="show('worker')">👷 Work</div>
<div class="card" onclick="show('admin')">🔐 Admin</div>
</div>
</div><div id="services" class="section">
<h2>Services</h2>
<div class="card" onclick="selectService('Food')">🍔 Food</div>
<div class="card" onclick="selectService('Grocery')">🛒 Grocery</div>
<div class="card" onclick="selectService('Electrician')">⚡ Electrician</div>
<div class="card" onclick="selectService('Mechanic')">🔧 Mechanic</div>
</div><div id="booking" class="section">
<h2>Book</h2>
<input id="name" placeholder="Name">
<input id="phone" placeholder="Mobile Number">
<select id="service" onchange="updateType()">
<option value="Food">Food</option>
<option value="Grocery">Grocery</option>
<option value="Electrician">Electrician</option>
<option value="Mechanic">Mechanic</option>
</select>
<select id="subcategory">
<option>Select option</option>
</select>
<input id="address" placeholder="Address">
<button type="button" onclick="getLocation()">Use My Location</button>
<div id="map" style="margin-top:15px;height:200px;border-radius:10px;overflow:hidden"></div>
<button onclick="book()">Book Now</button>
</div><div id="worker" class="section">
<h2>Work</h2>
<input id="wname" placeholder="Name">
<input id="wphone" placeholder="Mobile Number">
<input id="waddress" placeholder="Address">
<button onclick="registerWorker()">Register</button>
</div><div id="admin" class="section">
<h2>Admin</h2>
<input type="password" id="pass" placeholder="Password">
<button onclick="login()">Login</button>
<div id="panel" style="display:none">
<h3>Registered Workers</h3>
<ul id="workerList"></ul>
<h3>Booking Orders</h3>
<ul id="orderList"></ul>
</div>
</div><nav>
<button onclick="show('home')">🏠</button>
<button onclick="show('services')">🛠</button>
<button onclick="show('booking')">📦</button>
<button onclick="show('worker')">👷</button>
<button onclick="show('admin')">🔐</button>
</nav><script>
setTimeout(()=>{document.getElementById('splash').style.display='none';},2000);

function show(id){
document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
document.getElementById(id).classList.add('active');
}

function selectService(s){
document.getElementById('service').value=s;
show('booking');
}

function book(){
let name=document.getElementById('name').value;
let phone=document.getElementById('phone').value;
let service=document.getElementById('service').value;
let sub=document.getElementById('subcategory').value;
let address=document.getElementById('address').value;

let orders=JSON.parse(localStorage.getItem('orders')||'[]');
orders.push({name,phone,service,sub,address});
localStorage.setItem('orders',JSON.stringify(orders));

localStorage.setItem('lastAddress', address);
alert('Booked 🚀\n'+service+' - '+sub);
}

window.onload=function(){
let saved=localStorage.getItem('lastAddress');
if(saved){document.getElementById('address').value=saved;}
}

function updateType(){
let service=document.getElementById('service').value;
let sub=document.getElementById('subcategory');
sub.innerHTML='';
if(service==='Food' || service==='Grocery'){
sub.innerHTML=`<option>Home Delivery</option><option>Express Delivery</option><option>Schedule Delivery</option>`;
}else{
sub.innerHTML=`<option>Installation</option><option>Repair</option><option>Inspection</option>`;
}
}

function getLocation(){
if(navigator.geolocation){
navigator.geolocation.getCurrentPosition(function(pos){
var lat=pos.coords.latitude;
var lon=pos.coords.longitude;
document.getElementById('address').value='Lat: '+lat+', Lon: '+lon;
var mapFrame = `<iframe width="100%" height="200" frameborder="0" style="border:0" src="https://maps.google.com/maps?q=${lat},${lon}&z=15&output=embed"></iframe>`;
document.getElementById('map').innerHTML = mapFrame;
});
}else{
alert('Location not supported');
}
}

function registerWorker(){
let wname=document.getElementById('wname').value;
let wphone=document.getElementById('wphone').value;
let waddress=document.getElementById('waddress').value;
if(!wname||!wphone||!waddress){alert('Fill all fields');return;}
let workers=JSON.parse(localStorage.getItem('workers')||'[]');
workers.push({name:wname,phone:wphone,address:waddress});
localStorage.setItem('workers',JSON.stringify(workers));
alert('Worker Registered 👍');
}

function login(){
if(pass.value==='Swetha@149'){
document.getElementById('panel').style.display='block';

// Show workers
let workers=JSON.parse(localStorage.getItem('workers')||'[]');
let wlist=document.getElementById('workerList');
wlist.innerHTML='';
workers.forEach(w=>{
let li=document.createElement('li');
li.textContent=w.name+' | '+w.phone+' | '+w.address;
wlist.appendChild(li);
});

// Show orders
let orders=JSON.parse(localStorage.getItem('orders')||'[]');
let olist=document.getElementById('orderList');
olist.innerHTML='';
orders.forEach(o=>{
let li=document.createElement('li');
li.textContent=o.name+' | '+o.phone+' | '+o.service+' - '+o.sub+' | '+o.address;
olist.appendChild(li);
});

}else alert('Wrong Password');
}
</script></body>
 </html>

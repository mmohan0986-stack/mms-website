<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MMS</title>

<style>
body{font-family:Arial;margin:0;background:#eef2f7;}
header{background:#1e73be;color:#fff;text-align:center;padding:15px;font-size:24px;}

.section{display:none;padding:20px;opacity:0;transform:translateY(20px);transition:.3s;}
.section.active{display:block;opacity:1;transform:translateY(0);}

.card{background:#fff;margin:10px;padding:20px;border-radius:12px;text-align:center;box-shadow:0 4px 10px rgba(0,0,0,.1);cursor:pointer;}
.card:active{transform:scale(.95);}

input,select{width:100%;padding:10px;margin:10px 0;border-radius:8px;border:1px solid #ccc;}
button{background:#1e73be;color:#fff;border:none;padding:10px;border-radius:8px;width:100%;}

nav{position:fixed;bottom:0;width:100%;background:#fff;display:flex;justify-content:space-around;padding:10px;}

.food-item{display:flex;justify-content:space-between;align-items:center;background:#fff;margin:5px;padding:10px;border-radius:10px;}

.qty-box{display:flex;background:#1e73be;border-radius:8px;overflow:hidden;}
.qty-box button{background:none;color:#fff;border:none;width:30px;}
.qty-box span{background:#fff;color:#1e73be;width:25px;text-align:center;}
</style>
</head>

<body>

<header>MMS 🚀</header>

<div id="home" class="section active">
<h2>Welcome</h2>
<div class="card" onclick="show('services')">🛠 Services</div>
<div class="card" onclick="show('worker')">👷 Worker</div>
<div class="card" onclick="show('admin')">🔐 Admin</div>
</div>

<div id="services" class="section">
<div class="card" onclick="openFood()">🍔 Food</div>
<div class="card" onclick="openService('Grocery')">🛒 Grocery</div>
</div>

<!-- FOOD -->
<div id="food" class="section">
<input id="fname" placeholder="Name">
<input id="fphone" placeholder="Phone">

<button onclick="useLocation('Food')">📍 Location</button>
<div id="mapFood"></div>

<div id="foodList"></div>
<div id="cart"></div>

<button onclick="bookFood()">Order</button>
</div>

<!-- SERVICE -->
<div id="service" class="section">
<h3 id="stype"></h3>
<input id="name" placeholder="Name">
<input id="phone" placeholder="Phone">
<button onclick="useLocation('Service')">📍 Location</button>
<div id="mapService"></div>
<button onclick="bookService()">Book</button>
</div>

<!-- WORKER -->
<div id="worker" class="section">
<input id="wname" placeholder="Name">
<input id="wphone" placeholder="Phone">
<select id="wservice">
<option>Food</option>
<option>Grocery</option>
</select>
<button onclick="useLocation('Worker')">📍 Location</button>
<div id="mapWorker"></div>
<button onclick="registerWorker()">Register</button>
</div>

<!-- ADMIN -->
<div id="admin" class="section">
<input id="pass" placeholder="Password">
<button onclick="login()">Login</button>
<ul id="orders"></ul>
</div>

<nav>
<button onclick="show('home')">🏠</button>
<button onclick="show('services')">🛠</button>
<button onclick="show('worker')">👷</button>
<button onclick="show('admin')">🔐</button>
</nav>

<audio id="sound" src="https://www.soundjay.com/buttons/sounds/button-3.mp3"></audio>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const app = initializeApp({
databaseURL:"https://mmsapp-c1200-default-rtdb.asia-southeast1.firebasedatabase.app/"
});
const db=getDatabase(app);

window.db=db;
window.ref=ref;
window.push=push;
window.onValue=onValue;
</script>

<script>

// navigation
function show(id){
document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
setTimeout(()=>document.getElementById(id).classList.add('active'),50);
}

// FOOD
let menu=["Pizza","Burger","Cake"];
let cart={}; menu.forEach(i=>cart[i]=0);

function openFood(){
show('food');
foodList.innerHTML='';
menu.forEach(i=>{
foodList.innerHTML+=`
<div class="food-item">
${i}
<div class="qty-box">
<button onclick="change('${i}',-1)">-</button>
<span id="${i}">0</span>
<button onclick="change('${i}',1)">+</button>
</div>
</div>`;
});
}

function change(i,d){
cart[i]+=d; if(cart[i]<0)cart[i]=0;
document.getElementById(i).innerText=cart[i];
updateCart();
}

function updateCart(){
cartDiv.innerHTML='';
for(let k in cart){if(cart[k]>0)cartDiv.innerHTML+=k+" x"+cart[k]+"<br>";}
}

// SERVICE
function openService(s){show('service');stype.innerText=s;}

// LOCATION
let loc={};
function useLocation(type){
navigator.geolocation.getCurrentPosition(p=>{
let lat=p.coords.latitude,lon=p.coords.longitude;
loc[type]=`https://maps.google.com?q=${lat},${lon}`;
document.getElementById("map"+type).innerHTML=
`<iframe width="100%" height="150" src="https://maps.google.com/maps?q=${lat},${lon}&output=embed"></iframe>`;
});
}

// BOOK FOOD
function bookFood(){
if(!fname.value||!fphone.value)return alert("Enter details");

let items=[];
for(let k in cart){if(cart[k]>0)items.push(k+" x"+cart[k]);}
if(items.length==0)return alert("Select items");

push(ref(db,'orders'),{
service:"Food",
items:items.join(','),
name:fname.value,
phone:fphone.value,
map:loc['Food']
});

sound.play();
alert("Order placed");
}

// SERVICE
function bookService(){
push(ref(db,'orders'),{
service:stype.innerText,
name:name.value,
phone:phone.value,
map:loc['Service']
});
sound.play();
alert("Booked");
}

// WORKER
function registerWorker(){
push(ref(db,'workers'),{
name:wname.value,
phone:wphone.value,
service:wservice.value,
map:loc['Worker']
});
alert("Worker Added");
}

// ADMIN FIXED
function login(){
if(pass.value==="Swetha@149"){

onValue(ref(db,'orders'),snap=>{
let data=snap.val();
orders.innerHTML='';

if(!data){
orders.innerHTML="<li>No orders</li>";
return;
}

Object.values(data).forEach(o=>{
orders.innerHTML+=`
<li>
<b>${o.service}</b><br>
👤 ${o.name||'-'}<br>
📞 ${o.phone||'-'}<br>
🍔 ${o.items||''}<br>
📍 <a href="${o.map}" target="_blank">Map</a>
</li><br>`;
});

});

}else alert("Wrong password");
}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MMS</title>
<style>
body{font-family:Arial;margin:0;background:#eef2f7;transition:0.3s;}
header{background:#1e73be;color:white;text-align:center;padding:15px;box-shadow:0 2px 6px rgba(0,0,0,0.1);}
.section{display:none;padding:20px;animation:fade 0.5s;}
.active{display:block;}
@keyframes fade{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
#splash{position:fixed;top:0;left:0;width:100%;height:100%;background:#1e73be;color:white;display:flex;justify-content:center;align-items:center;font-size:30px;z-index:1000;animation:splashfade 2s forwards;}
@keyframes splashfade{0%{opacity:1;}90%{opacity:1;}100%{opacity:0;display:none;}}

/* Cards */
.card{background:white;margin:10px;padding:20px;border-radius:15px;text-align:center;box-shadow:0 3px 8px rgba(0,0,0,0.1);transition:transform 0.3s,box-shadow 0.3s;}
.card:hover{transform:scale(1.05);box-shadow:0 8px 16px rgba(0,0,0,0.2);cursor:pointer;}

/* Inputs and buttons */
input,select{width:100%;padding:10px;margin:10px 0;border-radius:10px;border:1px solid #ccc;transition:0.3s;outline:none;}
input:focus, select:focus{border-color:#1e73be;box-shadow:0 0 10px rgba(30,115,190,0.4);}
button{background:#1e73be;color:white;border:none;padding:10px;border-radius:10px;width:100%;transition:transform 0.2s, box-shadow 0.2s;}
button:hover{transform:scale(1.05);box-shadow:0 4px 12px rgba(30,115,190,0.3);cursor:pointer;}

/* Navigation */
nav{position:fixed;bottom:0;width:100%;background:white;display:flex;justify-content:space-around;padding:10px 0;box-shadow:0 -2px 8px rgba(0,0,0,0.1);transition:0.3s;}
nav button{background:none;border:none;font-size:18px;color:#1e73be;transition:transform 0.2s;}
nav button:hover{transform:scale(1.2);}
</style>
</head>
<body>

<div id="splash">MMS 🚀</div>

<header>MMS</header>

<!-- Home Page -->
<div id="home" class="section">
<h2>Welcome 👋</h2>
<p>All services in one app</p>
<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:15px;margin-top:20px">
<div class="card" onclick="show('services')">🛠 Services</div>
<div class="card" onclick="show('booking')">📦 Book</div>
<div class="card" onclick="show('worker')">👷 Work</div>
<div class="card" onclick="show('admin')">🔐 Admin</div>
</div>
</div>

<!-- Services -->
<div id="services" class="section">
<h2>Services</h2>
<div class="card" onclick="selectService('Food')">🍔 Food</div>
<div class="card" onclick="selectService('Grocery')">🛒 Grocery</div>
<div class="card" onclick="selectService('Electrician')">⚡ Electrician</div>
<div class="card" onclick="selectService('Mechanic')">🔧 Mechanic</div>
</div>

<!-- Booking -->
<div id="booking" class="section">
<h2>Book Service</h2>
<input id="name" placeholder="Name">
<input id="phone" placeholder="Mobile Number">
<select id="service" onchange="updateType()">
<option value="Food">Food</option>
<option value="Grocery">Grocery</option>
<option value="Electrician">Electrician</option>
<option value="Mechanic">Mechanic</option>
</select>
<select id="subcategory"></select>

<!-- Food menu with + / - -->
<div id="foodList" style="display:none;margin-top:10px;"></div>

<input id="address" placeholder="Address">
<button type="button" onclick="getLocation()">Use My Location</button>
<div id="map" style="margin-top:15px;height:200px;border-radius:10px;overflow:hidden"></div>
<button onclick="book()">Book Now</button>
</div>

<!-- Worker -->
<div id="worker" class="section">
<h2>Worker Registration</h2>
<input id="wname" placeholder="Name">
<input id="wphone" placeholder="Mobile Number">
<select id="wservice" onchange="updateWorkerType()">
<option value="Food">Food</option>
<option value="Grocery">Grocery</option>
<option value="Electrician">Electrician</option>
<option value="Mechanic">Mechanic</option>
</select>
<select id="wsubcategory"></select>
<input id="waddress" placeholder="Address">
<button type="button" onclick="getWorkerLocation()">Use My Location</button>
<div id="wmap" style="margin-top:15px;height:200px;border-radius:10px;overflow:hidden"></div>
<button onclick="registerWorker()">Register Worker</button>
</div>

<!-- Admin -->
<div id="admin" class="section">
<h2>Admin</h2>
<input type="password" id="pass" placeholder="Password">
<button onclick="login()">Login</button>
<div id="panel" style="display:none">
<h3>Registered Workers</h3>
<ul id="workerList"></ul>
<h3>Booking Orders</h3>
<ul id="orderList"></ul>
</div>
</div>

<!-- Rocket Animation -->
<div id="rocketContainer" style="position:fixed;bottom:10px;left:50%;transform:translateX(-50%);display:none;pointer-events:none;z-index:999;">
  <div id="rocket" style="font-size:50px;">🚀</div>
  <div id="fire" style="position:absolute;top:50px;left:50%;transform:translateX(-50%);font-size:25px;opacity:0.8;">🔥</div>
</div>
<audio id="rocketSound" src="https://www.soundjay.com/mechanical/sounds/rocket-launch-01.mp3"></audio>

<nav>
<button onclick="show('home')">🏠</button>
<button onclick="show('services')">🛠</button>
<button onclick="show('booking')">📦</button>
<button onclick="show('worker')">👷</button>
<button onclick="show('admin')">🔐</button>
</nav>

<script>
// Splash
setTimeout(()=>{document.getElementById('splash').style.display='none';document.getElementById('home').classList.add('active');},2000);

// Show section
function show(id){document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}

// Food menu
const foodMenu=[{name:"Pizza",price:250},{name:"Burger",price:120},{name:"Sandwich",price:100},{name:"Pasta",price:180},{name:"Fried Rice",price:150}];
let foodCart={};

function selectService(s){document.getElementById('service').value=s;updateType();show('booking');}

// Booking subcategories
function updateType(){
  let service=document.getElementById('service').value;
  let sub=document.getElementById('subcategory');
  let foodList=document.getElementById('foodList');
  sub.innerHTML=''; foodList.style.display='none'; foodCart={};

  if(service==='Food'){
    foodList.style.display='block'; foodList.innerHTML='';
    foodMenu.forEach(item=>{
      let div=document.createElement('div');
      div.style.display='flex'; div.style.justifyContent='space-between'; div.style.alignItems='center'; div.style.margin='5px 0';
      div.innerHTML=`<span>${item.name} - ₹${item.price}</span>
      <span>
        <button onclick="changeQty('${item.name}',-1)">−</button>
        <span id="qty_${item.name}">0</span>
        <button onclick="changeQty('${item.name}',1)">+</button>
      </span>`;
      foodList.appendChild(div); foodCart[item.name]=0;
    });
  }
  else if(service==='Grocery'){sub.innerHTML=`<option>Home Delivery</option><option>Express Delivery</option><option>Schedule Delivery</option>`;}
  else{sub.innerHTML=`<option>Installation</option><option>Repair</option><option>Inspection</option>`;}
}

// Worker subcategories
function updateWorkerType(){
  let service=document.getElementById('wservice').value;
  let sub=document.getElementById('wsubcategory'); sub.innerHTML='';
  if(service==='Food'){sub.innerHTML=`<option>Home Delivery</option><option>Express Delivery</option><option>Schedule Delivery</option>`;}
  else{sub.innerHTML=`<option>Installation</option><option>Repair</option><option>Inspection</option>`;}
}

// Change quantity
function changeQty(name,delta){
  let qty=foodCart[name]+delta; if(qty<0) qty=0; foodCart[name]=qty;
  document.getElementById('qty_'+name).innerText=qty;
}

// Location
function getLocation(){if(navigator.geolocation){navigator.geolocation.getCurrentPosition(p=>{let lat=p.coords.latitude, lon=p.coords.longitude;document.getElementById('address').value=`Lat: ${lat}, Lon: ${lon}`;document.getElementById('map').innerHTML=`<iframe width="100%" height="200" frameborder="0" style="border:0" src="https://maps.google.com/maps?q=${lat},${lon}&z=15&output=embed"></iframe>`;});}else alert('Location not supported');}
function getWorkerLocation(){if(navigator.geolocation){navigator.geolocation.getCurrentPosition(p=>{let lat=p.coords.latitude, lon=p.coords.longitude;document.getElementById('waddress').value=`Lat: ${lat}, Lon: ${lon}`;document.getElementById('wmap').innerHTML=`<iframe width="100%" height="200" frameborder="0" style="border:0" src="https://maps.google.com/maps?q=${lat},${lon}&z=15&output=embed"></iframe>`;});}else alert('Location not supported');}

// Book service + Rocket animation
function animateRocket(){
  const rocketContainer=document.getElementById('rocketContainer');
  const fire=document.getElementById('fire');
  const sound=document.getElementById('rocketSound');
  rocketContainer.style.bottom='10px'; rocketContainer.style.display='block';
  fire.style.opacity=1; sound.currentTime=0; sound.play();
  let pos=10; let fireAnim=0;
  let interval=setInterval(()=>{
    pos+=15; rocketContainer.style.bottom=pos+'px';
    fire.style.transform=`translateX(-50%) translateY(${Math.sin(fireAnim)*5}px)`;
    fireAnim+=0.3;
    if(pos>window.innerHeight){clearInterval(interval);rocketContainer.style.display='none';}
  },30);
}

function book(){
  let name=document.getElementById('name').value;
  let phone=document.getElementById('phone').value;
  let service=document.getElementById('service').value;
  let sub=document.getElementById('subcategory').value;
  let address=document.getElementById('address').value;
  let selectedFood=[];
  if(service==='Food'){for(let k in foodCart){if(foodCart[k]>0) selectedFood.push(k+' x'+foodCart[k]);}}
  let orders=JSON.parse(localStorage.getItem('orders')||'[]');
  orders.push({name,phone,service,sub,address,food:selectedFood.join(', ')});
  localStorage.setItem('orders',JSON.stringify(orders));
  localStorage.setItem('lastAddress', address);
  alert('Booked 🚀 '+service+(selectedFood.length? ' - '+selectedFood.join(', '):'')+' - '+sub);
  animateRocket(); // Rocket animation
  if(document.getElementById('panel').style.display==='block') updateAdminOrders();
}

// Register worker
function registerWorker(){
  let wname=document.getElementById('wname').value;
  let wphone=document.getElementById('wphone').value;
  let wservice=document.getElementById('wservice').value;
  let wsub=document.getElementById('wsubcategory').value;
  let waddress=document.getElementById('waddress').value;
  if(!wname||!wphone||!waddress){alert('Fill all fields');return;}
  let workers=JSON.parse(localStorage.getItem('workers')||'[]');
  workers.push({name:wname,phone:wphone,service:wservice,sub:wsub,address:waddress});
  localStorage.setItem('workers',JSON.stringify(workers));
  alert('Worker Registered 👍');
  if(document.getElementById('panel').style.display==='block') updateAdminWorkers();
}

// Admin login
function login(){if(pass.value==='Swetha@149'){document.getElementById('panel').style.display='block';updateAdminWorkers();updateAdminOrders();}else alert('Wrong Password');}

// Admin update
function updateAdminWorkers(){
  let workers=JSON.parse(localStorage.getItem('workers')||'[]');
  let wlist=document.getElementById('workerList'); wlist.innerHTML='';
  workers.forEach(w=>{
    let mapLink=w.address.includes('Lat:')?`https://www.google.com/maps?q=${w.address.match(/Lat: ([0-9.-]+), Lon: ([0-9.-]+)/)[1]},${w.address.match(/Lat: ([0-9.-]+), Lon: ([0-9.-]+)/)[2]}`:`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(w.address)}`;
    let li=document.createElement('li'); li.innerHTML=`${w.name} | ${w.phone} | ${w.service} - ${w.sub} | ${w.address} <a href='${mapLink}' target='_blank'>📍Map</a>`;
    wlist.appendChild(li);
  });
}
function updateAdminOrders(){
  let orders=JSON.parse(localStorage.getItem('orders')||'[]');
  let olist=document.getElementById('orderList'); olist.innerHTML='';
  orders.forEach(o=>{
    let mapLink=o.address.includes('Lat:')?`https://www.google.com/maps?q=${o.address.match(/Lat: ([0-9.-]+), Lon: ([0-9.-]+)/)[1]},${o.address.match(/Lat: ([0-9.-]+), Lon: ([0-9.-]+)/)[2]}`:`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(o.address)}`;
    let li=document.createElement('li'); li.innerHTML=`${o.name} | ${o.phone} | ${o.service} ${o.food?'- '+o.food:''} - ${o.sub} | ${o.address} <a href='${mapLink}' target='_blank'>📍Map</a>`;
    olist.appendChild(li);
  });
}

// Onload defaults
window.onload=function(){
  let saved=localStorage.getItem('lastAddress');
  if(saved){document.getElementById('address').value=saved;updateType();}
  updateWorkerType();
}
</script>

</body>
</html>

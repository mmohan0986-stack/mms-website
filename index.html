<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MMS</title>

<style>
body{font-family:Arial;margin:0;background:#eef2f7;}
header{background:#1e73be;color:white;text-align:center;padding:15px;font-size:24px;}

.section{display:none;padding:20px;animation:fade .3s;}
.section.active{display:block;}
@keyframes fade{from{opacity:0;transform:translateY(20px);}to{opacity:1;}}

.card{background:white;margin:10px;padding:20px;border-radius:15px;text-align:center;box-shadow:0 3px 8px rgba(0,0,0,0.1);cursor:pointer;}
.card:active{transform:scale(.95);}

input,select{width:100%;padding:10px;margin:10px 0;border-radius:10px;border:1px solid #ccc;}
button{background:#1e73be;color:white;border:none;padding:10px;border-radius:10px;width:100%;}

nav{position:fixed;bottom:0;width:100%;background:white;display:flex;justify-content:space-around;padding:10px;}

.food-item{display:flex;justify-content:space-between;background:white;padding:10px;margin:5px;border-radius:10px;}

.qty-box{display:flex;background:#1e73be;border-radius:8px;overflow:hidden;}
.qty-box button{background:none;color:white;border:none;width:30px;}
.qty-box span{background:white;color:#1e73be;width:25px;text-align:center;}
</style>
</head>

<body>

<header>MMS 🚀</header>

<!-- HOME -->
<div id="home" class="section active">
<h2>Welcome</h2>
<div class="card" onclick="show('services')">🛠 Services</div>
<div class="card" onclick="show('worker')">👷 Worker</div>
<div class="card" onclick="show('admin')">🔐 Admin</div>
</div>

<!-- SERVICES -->
<div id="services" class="section">
<div class="card" onclick="openFood()">🍔 Food</div>
<div class="card" onclick="openService('Grocery')">🛒 Grocery</div>
</div>

<!-- FOOD -->
<div id="food" class="section">

<input id="fname" placeholder="Your Name">
<input id="fphone" placeholder="Mobile Number">

<button onclick="useLocation('Food')">📍 Use Location</button>
<div id="mapFood"></div>

<div id="foodList"></div>

<h3>Cart</h3>
<div id="cart"></div>

<button onclick="bookFood()">Order</button>
</div>

<!-- SERVICE -->
<div id="service" class="section">
<h3 id="stype"></h3>
<input id="name" placeholder="Name">
<input id="phone" placeholder="Phone">
<button onclick="useLocation('Service')">📍 Use Location</button>
<div id="mapService"></div>
<button onclick="bookService()">Book</button>
</div>

<!-- WORKER -->
<div id="worker" class="section">
<input id="wname" placeholder="Name">
<input id="wphone" placeholder="Phone">
<select id="wservice">
<option>Food</option>
<option>Grocery</option>
</select>
<button onclick="useLocation('Worker')">📍 Use Location</button>
<div id="mapWorker"></div>
<button onclick="registerWorker()">Register</button>
</div>

<!-- ADMIN -->
<div id="admin" class="section">
<input id="pass" placeholder="Password">
<button onclick="login()">Login</button>

<div id="panel" style="display:none">
<h3>Orders</h3>
<ul id="orderList"></ul>
</div>

</div>

<nav>
<button onclick="show('home')">🏠</button>
<button onclick="show('services')">🛠</button>
<button onclick="show('worker')">👷</button>
<button onclick="show('admin')">🔐</button>
</nav>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const app = initializeApp({
databaseURL:"https://mmsapp-c1200-default-rtdb.asia-southeast1.firebasedatabase.app/"
});
const db = getDatabase(app);

window.db=db;
window.ref=ref;
window.push=push;
window.onValue=onValue;
</script>

<script>

// NAV
function show(id){
document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
document.getElementById(id).classList.add('active');
}

// FOOD
let menu=["Pizza","Burger","Cake","Noodles"];
let cart={};
menu.forEach(i=>cart[i]=0);

const foodList=document.getElementById('foodList');
const cartDiv=document.getElementById('cart');

function openFood(){
show('food');
foodList.innerHTML='';
menu.forEach(i=>{
foodList.innerHTML+=`
<div class="food-item">
${i}
<div class="qty-box">
<button onclick="change('${i}',-1)">-</button>
<span id="${i}">0</span>
<button onclick="change('${i}',1)">+</button>
</div>
</div>`;
});
updateCart();
}

function change(i,d){
cart[i]+=d;
if(cart[i]<0)cart[i]=0;
document.getElementById(i).innerText=cart[i];
updateCart();
}

function updateCart(){
cartDiv.innerHTML='';
for(let k in cart){
if(cart[k]>0){
cartDiv.innerHTML+=k+" x"+cart[k]+"<br>";
}
}
}

// SERVICE
function openService(s){
show('service');
document.getElementById('stype').innerText=s;
}

// LOCATION
let loc={};

function useLocation(type){
navigator.geolocation.getCurrentPosition(p=>{
let lat=p.coords.latitude;
let lon=p.coords.longitude;

loc[type]=`https://maps.google.com?q=${lat},${lon}`;

document.getElementById("map"+type).innerHTML=
`<iframe width="100%" height="150" src="https://maps.google.com/maps?q=${lat},${lon}&output=embed"></iframe>`;
});
}

// FOOD BOOK
function bookFood(){

let name=document.getElementById('fname').value;
let phone=document.getElementById('fphone').value;

if(!name||!phone){
alert("Enter name & phone");
return;
}

let items=[];
for(let k in cart){
if(cart[k]>0) items.push(k+" x"+cart[k]);
}

if(items.length==0){
alert("Select items");
return;
}

push(ref(db,'orders'),{
service:"Food",
items:items.join(','),
name:name,
phone:phone,
map:loc['Food']
});

alert("Order placed ✅");
}

// SERVICE BOOK
function bookService(){
push(ref(db,'orders'),{
service:document.getElementById('stype').innerText,
name:document.getElementById('name').value,
phone:document.getElementById('phone').value,
map:loc['Service']
});
alert("Booked");
}

// WORKER
function registerWorker(){
push(ref(db,'workers'),{
name:document.getElementById('wname').value,
phone:document.getElementById('wphone').value,
service:document.getElementById('wservice').value,
map:loc['Worker']
});
alert("Worker Registered");
}

// ADMIN FIXED
function login(){

if(document.getElementById('pass').value==="Swetha@149"){

document.getElementById('panel').style.display='block';

const olist=document.getElementById('orderList');

onValue(ref(db,'orders'),(snapshot)=>{

const data=snapshot.val();
olist.innerHTML='';

if(!data){
olist.innerHTML="<li>No orders</li>";
return;
}

Object.keys(data).forEach(key=>{
const o=data[key];

const li=document.createElement('li');

li.innerHTML=`
<b>${o.service}</b><br>
👤 ${o.name || '-'}<br>
📞 ${o.phone || '-'}<br>
🍔 ${o.items || ''}<br>
📍 <a href="${o.map}" target="_blank">Map</a>
<hr>
`;

olist.appendChild(li);

});

});

}else{
alert("Wrong password");
}

}

</script>

</body>
</html>

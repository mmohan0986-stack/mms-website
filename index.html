    <!DOCTYPE html>
<html>
<head>
  <title>MMS Cricket App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>🏏 MMS Live Cricket</h1>
</header>

<div class="container">

  <!-- Match 1 -->
  <div class="match-card">
    <h2 id="teams1">RCB vs CSK</h2>
    <p class="status">Live 🔴</p>
    <p id="score1">RCB: 120/3 (15 overs)</p>
    <button onclick="updateScore('score1')">Refresh</button>
  </div>

  <!-- Match 2 -->
  <div class="match-card">
    <h2 id="teams2">MI vs KKR</h2>
    <p class="status">Upcoming 🟡</p>
    <p>Starts at 7:30 PM</p>
  </div>

  <!-- Match 3 -->
  <div class="match-card">
    <h2 id="teams3">SRH vs RR</h2>
    <p class="status">Completed 🟢</p>
    <p>SRH won by 5 wickets</p>
  </div>

</div>

<footer>
  <p>Made by Mohan 🔥</p>
</footer>

<script src="script.js"></script>
</body>
</html>

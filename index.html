<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MMS – All in One Services</title>
<style>
body{font-family:Arial;margin:0;background:#eef2f7}
header{background:#1e73be;color:white;padding:25px;text-align:center}
nav{background:#222;padding:12px;text-align:center}
nav a{color:white;margin:0 15px;text-decoration:none;font-weight:bold}
.hero{padding:70px;text-align:center;background:linear-gradient(to right,#1e73be,#4da3ff);color:white}
button{background:white;color:#1e73be;border:none;padding:10px 20px;border-radius:20px;cursor:pointer}
.services{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;padding:30px}
.card{background:white;padding:20px;border-radius:12px;text-align:center;box-shadow:0 3px 8px rgba(0,0,0,0.1)}
form{background:white;padding:20px;border-radius:12px;max-width:500px;margin:auto}
input,select,textarea{width:100%;padding:10px;margin:8px 0;border-radius:8px;border:1px solid #ccc}
table{width:100%;border-collapse:collapse;background:white;margin-top:10px}
th,td{padding:8px;border:1px solid #ddd}
.hidden{display:none}
footer{background:#222;color:white;text-align:center;padding:15px}
</style>
</head>
<body>
<header><h1>MMS</h1><p>All-in-One Smart Services</p></header>
<nav>
<a href="#home">Home</a>
<a href="#services">Services</a>
<a href="#book">Book</a>
<a href="#worker">Work</a>
<a href="#admin">Admin</a>
</nav>
<section id="home" class="hero">
<h2>Everything in One Place</h2>
<p>Food, Grocery, Repairs, Tickets & More</p>
<a href="#book"><button>Start Booking</button></a>
</section>
<section id="services" class="services">
<div class="card">🍔 Food</div>
<div class="card">🛒 Grocery</div>
<div class="card">⚡ Electrician</div>
<div class="card">🔧 Mechanic</div>
<div class="card">🎟 Tickets</div>
<div class="card">💊 Medicine</div>
</section>
<section id="book">
<h2 align="center">Book Service</h2>
<form id="bookingForm">
<input id="name" placeholder="Name" required>
<input id="phone" placeholder="Phone" required>
<select id="service" required>
<option value="">Service</option>
<option>Food</option><option>Grocery</option><option>Electrician</option>
<option>Mechanic</option><option>Tickets</option><option>Medicine</option>
</select>
<textarea id="details" placeholder="Details"></textarea>
<button>Submit</button>
</form>
</section>
<section id="worker">
<h2 align="center">Worker Register</h2>
<form id="workerForm">
<input id="wname" placeholder="Name" required>
<input id="wphone" placeholder="Phone" required>
<select id="wskill"><option>Electrician</option><option>Mechanic</option></select>
<input id="wlocation" placeholder="Location">
<button>Register</button>
</form>
</section>
<section id="admin">
<h2 align="center">Admin</h2>
<div id="login">
<input type="password" id="pass" placeholder="Password">
<button onclick="login()">Login</button>
</div>
<div id="panel" class="hidden">
<button onclick="showOrders()">Orders</button>
<button onclick="showWorkers()">Workers</button>
<table id="orders" class="hidden"><tbody></tbody></table>
<table id="workers" class="hidden"><tbody></tbody></table>
</div>
</section>
<footer>© MMS</footer>
<script>
let orders=JSON.parse(localStorage.getItem('o'))||[];
let workers=JSON.parse(localStorage.getItem('w'))||[];document.getElementById('bookingForm').onsubmit=e=>{ e.preventDefault(); orders.push({n:name.value,p:phone.value,s:service.value,d:details.value,status:'Pending'}); localStorage.setItem('o',JSON.stringify(orders));alert('Booked');e.target.reset();};

document.getElementById('workerForm').onsubmit=e=>{ e.preventDefault(); workers.push({n:wname.value,p:wphone.value,s:wskill.value,l:wlocation.value}); localStorage.setItem('w',JSON.stringify(workers));alert('Registered');e.target.reset();};

function login(){if(pass.value==='Swetha@149'){loginDiv=document.getElementById('login');panel=document.getElementById('panel');loginDiv.classList.add('hidden');panel.classList.remove('hidden');}else alert('Wrong');}

function showOrders(){let t=document.querySelector('#orders tbody');t.innerHTML='';orders.forEach((o,i)=>{ t.innerHTML+=<tr><td>${o.n}</td><td>${o.s}</td><td>${o.status}</td><td><button onclick="done(${i})">Done</button><button onclick="del(${i})">X</button></td></tr>}); document.getElementById('orders').classList.remove('hidden');}

function showWorkers(){let t=document.querySelector('#workers tbody');t.innerHTML='';workers.forEach(w=>{ t.innerHTML+=<tr><td>${w.n}</td><td>${w.s}</td><td>${w.l}</td></tr>}); document.getElementById('workers').classList.remove('hidden');}

function done(i){orders[i].status='Completed';localStorage.setItem('o',JSON.stringify(orders));showOrders();} function del(i){orders.splice(i,1);localStorage.setItem('o',JSON.stringify(orders));showOrders();} </script>

</body>
  </html>
